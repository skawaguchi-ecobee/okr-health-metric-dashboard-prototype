<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKR &amp; Health Metric Dashboard — Prototypes</title>
<link rel="stylesheet" href="./v2/_ds/industry-97f34acc-96f8-4b4d-88f5-5182651d5659/styles.css">
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-8);
    background: var(--color-bg);
    color: var(--color-text);
  }
  .wrap { width: 100%; max-width: 640px; }
  .eyebrow {
    font-family: var(--font-heading);
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--color-accent-700);
  }
  h1 { margin: 2px 0 var(--space-2); font-size: 34px; }
  .lede { margin: 0 0 var(--space-8); color: var(--color-neutral-700); }
  .versions { display: flex; flex-direction: column; gap: var(--space-4); }
  .version {
    display: block;
    padding: var(--space-6);
    background: var(--color-surface);
    border: 1px solid var(--color-divider);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    color: inherit;
    text-decoration: none;
    transition: box-shadow .15s ease, border-color .15s ease, transform .15s ease;
  }
  .version:hover, .version:focus-visible {
    box-shadow: var(--shadow-md);
    border-color: var(--color-accent-400);
    transform: translateY(-1px);
    outline: none;
  }
  .version:focus-visible { border-color: var(--color-accent-600); }
  .version .tag {
    font-family: var(--font-heading);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--color-accent-700);
  }
  .version h2 { margin: var(--space-1) 0 var(--space-1); font-size: 22px; }
  .version p { margin: 0; color: var(--color-neutral-700); font-size: 14px; }
</style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">ECOBEE</div>
    <h1>OKR &amp; Health Metric Dashboard</h1>
    <p class="lede">Prototype iterations. Pick a version to view.</p>

    <div class="versions">
      <a class="version" href="./v2/index.html">
        <span class="tag">V2 · latest</span>
        <h2>Improved design</h2>
        <p>Refined layout, scoping controls, and health metrics.</p>
      </a>
      <a class="version" href="./v1/index.html">
        <span class="tag">V1</span>
        <h2>Initial concept</h2>
        <p>First pass at the leadership dashboard layout.</p>
      </a>
    </div>
  </main>
</body>
</html>
